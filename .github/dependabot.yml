# Opens weekly PRs for dependency updates. Each PR runs CI, so an update that breaks
# lint/types/tests is caught before merge. Expo packages are excluded: they must be
# upgraded together with `npx expo install --fix` during a deliberate SDK upgrade.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript <6.1 only; a TS 7 bump breaks `npm ci`.
      # Remove once `npm view typescript-eslint peerDependencies` allows 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Node type definitions must match the Node major we run (24 LTS, see .nvmrc).
      # Bump this together with .nvmrc, engines and the Render runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: monthly
    ignore:
      - dependency-name: 'expo*'
      - dependency-name: 'react'
      - dependency-name: 'react-native*'
      - dependency-name: '@types/react'
      # The Expo SDK pins its TypeScript version; expo-doctor rejects anything else.
      - dependency-name: 'typescript'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
